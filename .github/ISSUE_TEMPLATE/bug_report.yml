name: Bug report
description: Report a bug in Azshrtr
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For security issues, see [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps we can follow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: SemVer from VERSION / console, or commit SHA
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment
      options:
        - Local / Herd
        - Docker Compose
        - Shared hosting
        - VPS
        - Azshrtr Cloud
        - Other
    validations:
      required: true
