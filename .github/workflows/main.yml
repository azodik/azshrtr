name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit · integration · lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_KEY: base64:2fl+KtvkdphvQyE8m4YZqKzF2F8xQxN1yR3pL0wV8aE=
      APP_ENV: testing
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, pcntl, bcmath
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php -r "file_put_contents('.env', preg_replace('/^APP_KEY=.*/m', 'APP_KEY=' . getenv('APP_KEY'), file_get_contents('.env')));"

      - name: VERSION matches package.json
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::VERSION ($VERSION) does not match package.json ($PKG). Bump both together."
            exit 1
          fi
          echo "Version OK: $VERSION"

      - name: Format (Pint)
        run: ./vendor/bin/pint --test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (Biome)
        run: npm run lint

      - name: Unit & integration tests
        run: composer test
