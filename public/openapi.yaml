openapi: 3.1.0
info:
  title: Azshrtr API
  version: 1.0.0
  summary: URL shortener and QR platform API
  description: 'Two authentication modes and clear tag groups in the explorer.


    **1. Product API (Bearer API key)** — tags under *Product API*

    `Authorization: Bearer az_live_…` or `az_test_…`

    Org context always comes from the key (never a path you can swap to another workspace).


    **2. Console session (cookie)** — Auth + Workspace + Links tags

    Sanctum cookie after login. Mutations need CSRF (`X-XSRF-TOKEN` / `X-CSRF-TOKEN`).

    API keys do **not** work on these routes.


    **Roles (console):** Owner manages billing; Owner/Admin manage members & API keys; Members can work
    with links/QR/domains/analytics.


    Interactive explorer: `/docs/api-explorer`. Spec: `/openapi.yaml`.

    '
  contact:
    name: Azodik Consulting Private Limited
    url: https://azodik.com
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://azshrtr.test
  description: Local (Herd) — https://azshrtr.test
- url: http://localhost:8080
  description: Local (Docker Compose) — http://localhost:8080
- url: https://azshrtr.com
  description: Production — https://azshrtr.com
- url: '{baseUrl}'
  description: Custom deployed instance
  variables:
    baseUrl:
      default: https://azshrtr.com
      description: Application root URL (no trailing slash)
security: []
tags:
- name: Health
  description: Public liveness and dependency checks.
- name: Product Me
  description: 'Bearer API key: current organization, plan, and usage.'
- name: Product Links
  description: 'Bearer API key: short-link CRUD and click listings.'
- name: Auth Session
  description: Register, login, logout, profile, password, and session helpers (cookie + CSRF for signed-in
    routes).
- name: Auth MFA
  description: TOTP authenticator setup, challenge, recovery codes, and disable.
- name: Auth Email OTP
  description: Email one-time codes as an alternate second factor at sign-in.
- name: Auth Passkeys
  description: WebAuthn passkey registration and passwordless login.
- name: Auth Email
  description: Email verification and resend confirmation.
- name: Organizations
  description: Create and list workspaces the signed-in user belongs to.
- name: Members
  description: Team roster, invites, roles, and removals (Owner/Admin for mutations).
- name: Console Links
  description: Console short-link management for a workspace.
- name: QR Codes
  description: Generate, list, download, and delete QR codes.
- name: Domains
  description: Custom domain add, verify, and DNS records.
- name: API Keys
  description: Create and revoke product API keys (Owner/Admin).
- name: Analytics
  description: Workspace overview and click analytics.
- name: API Logs
  description: Product API request logs for the workspace.
- name: Audit Logs
  description: Workspace audit trail (retention follows plan).
- name: Billing
  description: Plan, invoices, checkout, cancel, and resume. Pro is granted only via verified webhooks.
- name: Import Export
  description: Bulk import and export of short links.
- name: Webhooks
  description: Provider webhook receivers (Dodo Payments).
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: az_live_|az_test_
      description: 'Organization API key for the Product API (`/api/v1/me`, `/api/v1/links`, …). Send
        as `Authorization: Bearer az_live_…` or `az_test_…`. Scopes: links:read, links:write, qr:write,
        domains:read, analytics:read.'
    ConsoleSession:
      type: apiKey
      in: cookie
      name: azshrtr_session
      description: 'Laravel Sanctum SPA/session cookie used by the React console after login.

        Not an API key. Pair with CSRF (`X-XSRF-TOKEN` / `X-CSRF-TOKEN`) on unsafe methods.

        Required for `/api/v1/auth/me`, org console routes, billing, members, etc.

        '
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsoleLinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SearchQ:
      name: q
      in: query
      schema:
        type: string
    ExportFormat:
      name: format
      in: query
      schema:
        type: string
        enum:
        - csv
        - json
        default: csv
  schemas:
    ErrorMessage:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    HealthStatus:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
        checks:
          type: object
          properties:
            database:
              type: object
              properties:
                ok:
                  type: boolean
                error:
                  type: string
                  description: Present only when APP_DEBUG is true and the check failed
              required:
              - ok
          required:
          - database
      required:
      - ok
      - service
      - checks
    Ok:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
    Link:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          nullable: true
        domain_id:
          type: string
          format: uuid
        code:
          type: string
        destination_url:
          type: string
          format: uri
        title:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_disabled:
          type: boolean
        is_anonymous:
          type: boolean
        click_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LinkCreate:
      type: object
      required:
      - destination_url
      properties:
        destination_url:
          type: string
          maxLength: 2048
        title:
          type: string
          maxLength: 255
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        password:
          type: string
          maxLength: 128
          nullable: true
        domain_id:
          type: string
          format: uuid
          nullable: true
    LinkUpdate:
      type: object
      properties:
        destination_url:
          type: string
          maxLength: 2048
        title:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        password:
          type: string
          nullable: true
        is_disabled:
          type: boolean
    LinkEnvelope:
      type: object
      required:
      - link
      properties:
        link:
          $ref: '#/components/schemas/Link'
    PaginatedLinks:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    ProductMe:
      type: object
      properties:
        organization:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            slug:
              type: string
        plan:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
        usage:
          type: object
          properties:
            period:
              type: string
            links_created:
              type: integer
            qr_generated:
              type: integer
            api_calls:
              type: integer
    AuthUser:
      type: object
      required:
      - id
      - name
      - email
      - mfa_enabled
      - organizations
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
        email_verified_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-08-01T10:00:00+00:00'
        theme_preference:
          type: string
          enum:
          - light
          - dark
          - system
          example: system
        preferred_locale:
          type:
          - string
          - 'null'
          example: en
        mfa_enabled:
          type: boolean
          example: false
        organizations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
                example: Ada's workspace
              slug:
                type: string
                example: adas-workspace
              role:
                type: string
                enum:
                - owner
                - admin
                - member
                example: owner
    AuthPayload:
      type: object
      required:
      - user
      - csrf_token
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        csrf_token:
          type: string
          description: Laravel CSRF token for subsequent cookie-session requests
          example: xK9mZ2pQ…
      example:
        user:
          id: 0198a1b2-c3d4-7000-8000-000000000001
          name: Ada Lovelace
          email: ada@example.com
          email_verified_at: '2026-08-01T10:00:00+00:00'
          theme_preference: system
          preferred_locale: en
          mfa_enabled: false
          organizations:
          - id: 0198a1b2-c3d4-7000-8000-0000000000aa
            name: Ada's workspace
            slug: adas-workspace
            role: owner
        csrf_token: xK9mZ2pQ…
    MessageResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
      example:
        message: OK
    MfaRequiredResponse:
      type: object
      required:
      - mfa_required
      - message
      properties:
        mfa_required:
          type: boolean
          example: true
        message:
          type: string
          example: Enter your authenticator or recovery code to continue.
    MfaStatusResponse:
      type: object
      properties:
        mfa_enabled:
          type: boolean
          example: true
        mfa_confirmed_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-07-15T08:30:00+00:00'
        recovery_codes_remaining:
          type: integer
          example: 8
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
    BulkDelete:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    BulkDeleteResult:
      type: object
      properties:
        ok:
          type: boolean
        deleted:
          type: integer
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
paths:
  /api/v1/health:
    get:
      tags:
      - Health
      operationId: getHealth
      summary: Health check
      description: 'Liveness and dependency probe. Returns `200` when the app and MariaDB

        (configured database connection) are reachable; `503` when the database check fails.

        '
      security: []
      responses:
        200:
          description: Service and database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                ok: true
                service: azshrtr
                checks:
                  database:
                    ok: true
        503:
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                ok: false
                service: azshrtr
                checks:
                  database:
                    ok: false
  /api/v1/me:
    get:
      tags:
      - Product Me
      operationId: productMe
      summary: Organization, plan, and usage for the API key
      security:
      - ApiKeyAuth: []
      responses:
        200:
          description: Current organization context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductMe'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
      description: Organization, plan, and usage for the API key. Tagged under **Product Me**. See request/response
        schemas below.
  /api/v1/links:
    get:
      tags:
      - Product Links
      operationId: productListLinks
      summary: List links for the API key organization
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        200:
          description: Paginated links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLinks'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
      description: List links for the API key organization. Tagged under **Product Links**. See request/response
        schemas below.
    post:
      tags:
      - Product Links
      operationId: productCreateLink
      summary: Create a short link
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkCreate'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
      description: Create a short link. Tagged under **Product Links**. See request/response schemas below.
  /api/v1/links/{id}:
    get:
      tags:
      - Product Links
      operationId: productShowLink
      summary: Show a link
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/LinkId'
      responses:
        200:
          description: Link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkEnvelope'
        404:
          $ref: '#/components/responses/NotFound'
      description: Show a link. Tagged under **Product Links**. See request/response schemas below.
    patch:
      tags:
      - Product Links
      operationId: productUpdateLink
      summary: Update a link
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/LinkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkUpdate'
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkEnvelope'
        422:
          $ref: '#/components/responses/Unprocessable'
      description: Update a link. Tagged under **Product Links**. See request/response schemas below.
    delete:
      tags:
      - Product Links
      operationId: productDeleteLink
      summary: Delete a link
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/LinkId'
      responses:
        200:
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
      description: Delete a link. Tagged under **Product Links**. See request/response schemas below.
  /api/v1/links/{id}/clicks:
    get:
      tags:
      - Product Links
      operationId: productLinkClicks
      summary: Paginated click analytics for a link
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/LinkId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        200:
          description: Paginated clicks
        403:
          $ref: '#/components/responses/Forbidden'
      description: Paginated click analytics for a link. Tagged under **Product Links**. See request/response
        schemas below.
  /api/v1/webhooks/dodo:
    post:
      tags:
      - Webhooks
      operationId: dodoWebhook
      summary: Dodo Payments webhook receiver
      security: []
      description: HMAC-verified when DODO_PAYMENTS_WEBHOOK_SECRET is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        200:
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        401:
          description: Invalid signature
  /api/v1/auth/register:
    post:
      tags:
      - Auth Session
      operationId: authRegister
      summary: Register a user and default organization
      description: 'Console browser-session endpoint. Creates the user, a default organization,

        starts a Sanctum cookie session, and emails an email-verification code.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              - password_confirmation
              - accepted_terms
              properties:
                name:
                  type: string
                  maxLength: 120
                  example: Ada Lovelace
                email:
                  type: string
                  format: email
                  example: ada@example.com
                password:
                  type: string
                  format: password
                  example: correct-horse-battery-staple
                password_confirmation:
                  type: string
                  format: password
                  example: correct-horse-battery-staple
                accepted_terms:
                  type: boolean
                  example: true
                preferred_locale:
                  type: string
                  enum:
                  - en
                  - es
                  - fr
                  - de
                  - hi
                  example: en
            example:
              name: Ada Lovelace
              email: ada@example.com
              password: correct-horse-battery-staple
              password_confirmation: correct-horse-battery-staple
              accepted_terms: true
              preferred_locale: en
      responses:
        201:
          description: Registered and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        422:
          $ref: '#/components/responses/Unprocessable'
  /api/v1/auth/login:
    post:
      tags:
      - Auth Session
      operationId: authLogin
      summary: Sign in with email and password
      description: 'Returns `AuthPayload` when MFA is off. If MFA is enabled, returns

        `mfa_required: true` and no session cookie until `/auth/mfa/challenge` succeeds.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: ada@example.com
                password:
                  type: string
                  format: password
                  example: correct-horse-battery-staple
                remember:
                  type: boolean
                  example: true
                preferred_locale:
                  type: string
                  example: en
            example:
              email: ada@example.com
              password: correct-horse-battery-staple
              remember: true
      responses:
        200:
          description: Signed in, or MFA challenge required
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AuthPayload'
                - $ref: '#/components/schemas/MfaRequiredResponse'
              examples:
                signed_in:
                  summary: MFA off — session started
                  value:
                    user:
                      id: 0198a1b2-c3d4-7000-8000-000000000001
                      name: Ada Lovelace
                      email: ada@example.com
                      email_verified_at: '2026-08-01T10:00:00+00:00'
                      theme_preference: system
                      preferred_locale: en
                      mfa_enabled: false
                      organizations:
                      - id: 0198a1b2-c3d4-7000-8000-0000000000aa
                        name: Ada's workspace
                        slug: adas-workspace
                        role: owner
                    csrf_token: xK9mZ2pQ…
                mfa_required:
                  summary: MFA enabled — complete challenge next
                  value:
                    mfa_required: true
                    message: Enter your authenticator or recovery code to continue.
        422:
          $ref: '#/components/responses/Unprocessable'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth Session
      operationId: authLogout
      summary: Sign out
      security:
      - ConsoleSession: []
      responses:
        200:
          description: Session invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              example:
                ok: true
      description: Sign out. Tagged under **Auth Session**. See request/response schemas below.
  /api/v1/auth/me:
    get:
      tags:
      - Auth Session
      operationId: authMe
      summary: Current session user
      security:
      - ConsoleSession: []
      responses:
        200:
          description: Current user and CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        401:
          $ref: '#/components/responses/Unauthorized'
      description: Current session user. Tagged under **Auth Session**. See request/response schemas below.
  /api/v1/auth/profile:
    patch:
      tags:
      - Auth Session
      operationId: authUpdateProfile
      summary: Update profile fields
      security:
      - ConsoleSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 120
                  example: Ada Lovelace
                preferred_locale:
                  type: string
                  enum:
                  - en
                  - es
                  - fr
                  - de
                  - hi
                  example: en
                theme_preference:
                  type: string
                  enum:
                  - light
                  - dark
                  - system
                  example: dark
            example:
              name: Ada Lovelace
              preferred_locale: en
              theme_preference: dark
      responses:
        200:
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/Unprocessable'
      description: Update profile fields. Tagged under **Auth Session**. See request/response schemas
        below.
  /api/v1/auth/password:
    put:
      tags:
      - Auth Session
      operationId: authUpdatePassword
      summary: Change password
      security:
      - ConsoleSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - password
              - password_confirmation
              properties:
                current_password:
                  type: string
                  format: password
                  example: old-password-here
                password:
                  type: string
                  format: password
                  example: new-correct-horse-battery
                password_confirmation:
                  type: string
                  format: password
                  example: new-correct-horse-battery
            example:
              current_password: old-password-here
              password: new-correct-horse-battery
              password_confirmation: new-correct-horse-battery
      responses:
        200:
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Password updated.
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/Unprocessable'
      description: Change password. Tagged under **Auth Session**. See request/response schemas below.
  /api/v1/auth/forgot-password:
    post:
      tags:
      - Auth Session
      operationId: authForgotPassword
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  example: ada@example.com
                preferred_locale:
                  type: string
                  example: en
            example:
              email: ada@example.com
      responses:
        200:
          description: Always OK (does not reveal whether the email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
