      - Billing
      operationId: consoleBillingCheckoutReturn
      summary: Record checkout return status
      description: Called by the console after the browser returns from Dodo checkout. Never grants Pro
        by itself — only records failed/cancelled returns for audit/email. Pro is applied only from verified
        webhooks.
      security:
      - ConsoleSession: []
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  example: failed
                subscription_id:
                  type: string
                  nullable: true
            example:
              status: failed
              subscription_id: null
      responses:
        '200':
          description: Return acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
